<style>
:root {
  --obsidian: #070B0A; --ink: #0E1513; --ivory: #F4F3EF; --paper: #FFFFFF; --line: #E6E3DA; --line2: #EEEBE4;
  --muted: #55595A; --faint: #7B7F80; --gold: #9C7B3C; --champagne: #D6BD86; --champagne-2: #F0DEB4;
  --green: #2F8F6B; --red: #B42318; --cream: #F8F3E7;
  --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif; --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ivory); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
header.hero { background: radial-gradient(ellipse 80% 70% at 80% 0%, rgba(214,189,134,.16), transparent 60%), var(--obsidian); color: #fff; padding: 22px 0 34px; }
.brand { display: flex; align-items: center; justify-content: space-between; font-size: 12px; letter-spacing: .3em; font-weight: 600; color: rgba(255,255,255,.75); }
.brand img { width: 24px; height: 24px; vertical-align: middle; margin-right: 8px; }
.brand small { letter-spacing: .08em; font-weight: 500; color: rgba(255,255,255,.5); text-transform: none; font-size: 12.5px; }
h1 { font-size: 34px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 600; margin: 26px 0 0; }
h1 em, h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; background: linear-gradient(100deg, var(--champagne-2), var(--champagne) 45%, #B8964F); -webkit-background-clip: text; background-clip: text; color: transparent; }
.street { margin-top: 10px; color: rgba(255,255,255,.7); font-size: 16px; }
.stage { display: inline-block; margin-top: 16px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: rgba(214,189,134,.16); color: var(--champagne); border: 1px solid rgba(214,189,134,.3); }
.count { margin-top: 22px; display: flex; align-items: baseline; gap: 10px; }
.count b { font-size: 54px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.count span { color: rgba(255,255,255,.65); font-size: 15px; }
main { padding: 18px 0 60px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 22px; margin-top: 14px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
h2 { font-size: 21px; letter-spacing: -0.02em; font-weight: 600; margin: 6px 0 0; }
.sub { color: var(--muted); font-size: 14.5px; margin-top: 4px; }
.steps { list-style: none; margin: 16px 0 0; padding: 0; }
.steps li { position: relative; padding: 0 0 16px 30px; }
.steps li::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: 0; width: 2px; background: var(--line2); }
.steps li:last-child::before { display: none; }
.dot { position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
.steps li.done .dot { background: var(--green); border-color: var(--green); }
.steps li.done .dot::after { content: "✓"; color: #fff; font-size: 10px; position: absolute; left: 2px; top: -1px; font-weight: 700; }
.steps li.next .dot { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(214,189,134,.25); }
.steps b { font-weight: 600; display: block; }
.steps li.done b { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.2); }
.steps .when { font-size: 13.5px; color: var(--faint); }
.steps li.next .when { color: var(--gold); font-weight: 600; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line2); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.box { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--gold); display: grid; place-items: center; margin-top: 1px; }
.check.on .box { background: var(--gold); }
.check.on .box::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; }
.check.on .lbl { color: var(--faint); text-decoration: line-through; }
.check small { display: block; color: var(--faint); font-size: 13px; }
.home { padding: 14px 0; border-top: 1px solid var(--line2); }
.home:first-of-type { border-top: 0; }
.home .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.home .time { font-size: 13px; font-weight: 600; color: var(--gold); white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.links a, .pill { font-size: 13.5px; font-weight: 500; color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--ivory); }
.rate { display: flex; gap: 8px; margin-top: 10px; }
.rate button { font: 600 14px var(--sans); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
.rate button.on.up { background: #E8F4EE; border-color: var(--green); color: var(--green); }
.rate button.on.down { background: #FBECEA; border-color: var(--red); color: var(--red); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tools button { font: 600 13.5px var(--sans); padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(214,189,134,.35); background: rgba(255,255,255,.06); color: var(--champagne-2); cursor: pointer; }
.ghost { font: 600 14px var(--sans); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--ivory); color: var(--ink); cursor: pointer; margin-top: 12px; }
.thread { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--obsidian); color: #F4F3EF; border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: var(--cream); color: var(--ink); border-bottom-left-radius: 6px; }
.msg small { display: block; font-size: 11.5px; opacity: .6; margin-top: 3px; }
.ask { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
.ask textarea { flex: 1; font: 15px var(--sans); padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); min-height: 44px; resize: vertical; }
.ask button { font: 600 14px var(--sans); padding: 11px 16px; border-radius: 999px; border: 0; background: var(--obsidian); color: var(--champagne-2); cursor: pointer; }
.member { padding: 12px 0; border-top: 1px solid var(--line2); }
.member small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.member b { display: block; font-size: 15.5px; margin-top: 2px; }
.member span { display: block; color: var(--muted); font-size: 13.5px; }
.member .links { margin-top: 8px; }
.celebrate canvas { width: 100%; height: auto; border-radius: 16px; margin-top: 12px; display: block; }
.note { width: 100%; margin-top: 8px; font: 14.5px var(--sans); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; resize: vertical; min-height: 42px; }
.quote { padding: 12px 14px; margin-top: 10px; background: var(--cream); border-radius: 12px; font-size: 15px; }
.quote::before { content: "“"; color: var(--gold); font-family: var(--serif); font-size: 26px; line-height: 0; margin-right: 4px; vertical-align: -8px; }
.stat { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
.stat b { font-size: 34px; font-weight: 600; letter-spacing: -0.04em; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.facts div { background: var(--ivory); border-radius: 12px; padding: 10px 12px; }
.facts small { display: block; font-size: 12px; color: var(--faint); }
.facts span { font-weight: 600; font-size: 15px; }
.move li { list-style: none; display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line2); }
.move { margin: 12px 0 0; padding: 0; }
.move li:first-child { border-top: 0; }
.move .d { font-size: 13px; font-weight: 600; color: var(--gold); }
.move li.past { opacity: .5; }
.next h2 { margin-bottom: 2px; }
.nextwhen { color: var(--gold); font-weight: 600; font-size: 14px; margin-bottom: 10px; }
.nextrow { margin-top: 10px; }
.nextrow small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.nextrow p { margin: 4px 0 0; font-size: 15.5px; line-height: 1.5; }
.nextafter { margin-top: 14px; }
.shield { border: 1.5px solid #E7B9B3; }
.shieldsteps { margin: 12px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.55; }
.shieldsteps li { margin-bottom: 6px; }
.warn { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #FBECEA; color: #7A1A12; font-size: 14px; }
label.f { display: block; font-size: 13.5px; font-weight: 600; margin-top: 14px; }
label.f small { font-weight: 400; color: var(--faint); }
input.t, textarea.t { width: 100%; margin-top: 6px; font: 15px var(--sans); padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
textarea.t { min-height: 70px; resize: vertical; }
.btn { display: inline-block; margin-top: 16px; font: 600 15px var(--sans); padding: 13px 20px; border-radius: 999px; border: 0; cursor: pointer; background: linear-gradient(180deg, var(--champagne-2), var(--champagne)); color: var(--obsidian); }
.saved { color: var(--green); font-weight: 600; font-size: 14px; margin-left: 10px; }
.empty { color: var(--faint); font-size: 14.5px; margin-top: 10px; }
footer { text-align: center; color: var(--faint); font-size: 13px; padding: 10px 16px 40px; }
footer a { color: var(--gold); text-decoration: none; }
.center { text-align: center; padding: 80px 16px; color: var(--muted); }
.gsec { margin-top: 18px; }
.gsec h3 { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0; }
.demo-bar { position: sticky; top: 0; z-index: 9; text-align: center; font-size: 13px; padding: 9px 14px; background: #D6BD86; color: #070B0A; font-weight: 500; }
.demo-bar a { color: #070B0A; font-weight: 700; }
.gsec p { margin: 6px 0 0; white-space: pre-wrap; }
@media (max-width: 420px) { h1 { font-size: 30px; } .facts { grid-template-columns: 1fr; } }
</style>

    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    (d.dates || []).filter(function (x) { return !x.done && x.date; }).forEach(function (x, i) {
      lines.push('BEGIN:VEVENT', 'UID:vinto-' + icsDate(x.date) + '-' + i + '@vintorealty.com', 'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + icsDate(x.date), 'DTEND;VALUE=DATE:' + nextDay(x.date),
        'SUMMARY:' + String(x.label).replace(/[,;\\]/g, ' ') + ' · ' + String(d.street || '').replace(/[,;\\]/g, ' '),
        'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:' + String(x.label).replace(/[,;\\]/g, ' ') + ' tomorrow', 'END:VALARM', 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function renderThread(list) {
    var t = document.getElementById('thread'); if (!t) return;
    t.innerHTML = (list || []).map(function (m) {
      return '<div class="msg ' + (m.fromClient ? 'me' : 'them') + '">' + esc(m.body) + '<small>' + (m.fromClient ? 'You' : 'Your agent') + ' · ' + new Date(m.at).toLocaleString(LOC, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</small></div>';
    }).join('');
    translate(t);
  }
  function wireMessages() {
    var card = document.getElementById('msgCard'), form = document.getElementById('askForm');
    if (!card || !form) return;
    rpc('client_messages_for', { t: token }).then(function (list) {
      card.style.display = '';
      var after = document.getElementById('afterCard'); if (after) after.style.display = '';
      renderThread(list);
    }).catch(function () { /* not turned on yet for this agent */ });
    function sendMsg(body) { return rpc('client_ask', { t: token, p_body: body }).then(function () { return rpc('client_messages_for', { t: token }).then(renderThread); }); }
    var val = document.getElementById('askValue');
    if (val) val.addEventListener('click', function () {
      val.disabled = true;
      sendMsg('Could you send me an update on what my home is worth in today’s market?').then(function () { val.textContent = 'Sent! Your agent will follow up.'; })
        .catch(function () { val.disabled = false; alert('That didn’t send. Please try again.'); });
    });
    var ref = document.getElementById('refer');
    if (ref) ref.addEventListener('submit', function (e) {
      e.preventDefault();
      var n = document.getElementById('refName').value.trim(), c = document.getElementById('refContact').value.trim(), note = document.getElementById('refNote').value.trim();
      if (!n || !c) { alert('Add their name and a phone number or email.'); return; }
      sendMsg('Referral: ' + n + ' (' + c + ')' + (note ? ' · ' + note : '')).then(function () {
        ref.reset(); document.getElementById('refSaved').textContent = 'Sent. Thank you!';
      }).catch(function () { alert('That didn’t send. Please try again.'); });
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var box = document.getElementById('askText'), body = box.value.trim();
      if (!body) return;
      var btn = form.querySelector('button'); btn.disabled = true;
      rpc('client_ask', { t: token, p_body: body }).then(function () {
        box.value = '';
        return rpc('client_messages_for', { t: token }).then(renderThread);
      }).catch(function () { alert('That didn’t send. Please try again, or text your agent.'); })
        .then(function () { btn.disabled = false; });
    });
  }

  function wirePublic() {
    var card = document.getElementById('pubCard'); if (!card) return;
    rpc('client_public_record', { t: token }).then(function (r) {
      if (!r) return;
      var rows = [['County', r.county], ['Parcel ID', r.parcelId], ['Acres', r.acres], ['Subdivision', r.subdivision], ['Zoning', r.zoning], ['Tax year', r.taxYear]];
      document.getElementById('pubFacts').innerHTML = rows.filter(function (x) { return x[1]; }).map(function (x) { return '<div><small>' + esc(x[0]) + '</small><span>' + esc(x[1]) + '</span></div>'; }).join('');
      card.style.display = '';
      translate(card);
    }).catch(function () {});
  }

  function wireTeam() {
    rpc('client_team', { t: token }).then(function (t) {
      if (!t || !t.agent) return;
      var people = [t.agent].concat(t.team || []);
      var tel = function (p) { return String(p).replace(/[^\d+]/g, ''); };
      document.getElementById('team').innerHTML = people.map(function (m) {
        return '<div class="member"><small>' + esc(m.role) + '</small><b>' + esc(m.name) + '</b>' + (m.company ? '<span>' + esc(m.company) + '</span>' : '') +
          '<div class="links">' + (m.phone ? '<a href="tel:' + esc(tel(m.phone)) + '">Call</a><a href="sms:' + esc(tel(m.phone)) + '">Text</a>' : '') + (m.email ? '<a href="mailto:' + esc(m.email) + '">Email</a>' : '') + '</div></div>';
      }).join('');
      document.getElementById('teamCard').style.display = '';
      var atty = (t.team || []).filter(function (m) { return /attorney|closing/i.test(m.role || '') && m.phone; })[0], box = document.getElementById('wireAtty');
      if (atty && box) { box.innerHTML = '<div class="member"><small>' + esc(atty.role) + '</small><b>' + esc(atty.name) + '</b>' + (atty.company ? '<span>' + esc(atty.company) + '</span>' : '') + '<div class="links"><a href="tel:' + esc(tel(atty.phone)) + '">Call ' + esc(atty.phone) + '</a></div><span class="sub">From your agent, not from an email.</span></div>'; translate(box); }
      translate(document.getElementById('teamCard'));
    }).catch(function () {});
  }

  function drawCard(d, agentName) {
    var c = document.getElementById('closedCard'); if (!c || !c.getContext) return;
    var x = c.getContext('2d'), W = c.width, H = c.height;
    var g = x.createRadialGradient(W * 0.8, 0, 50, W * 0.8, 0, H); g.addColorStop(0, '#2a2416'); g.addColorStop(0.6, '#070B0A'); g.addColorStop(1, '#070B0A');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    // confetti
    var seed = 7; function r() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 140; i++) { x.save(); x.translate(r() * W, r() * H * 0.55); x.rotate(r() * 6.28); x.fillStyle = ['#D6BD86', '#F0DEB4', '#9C7B3C', '#ffffff'][i % 4]; x.globalAlpha = 0.25 + r() * 0.6; x.fillRect(-6, -14, 12, 28); x.restore(); }
    x.globalAlpha = 1;
    // gold frame
    x.strokeStyle = 'rgba(214,189,134,.55)'; x.lineWidth = 3; x.strokeRect(54, 54, W - 108, H - 108);
    x.textAlign = 'center';
    x.fillStyle = '#D6BD86'; x.font = '600 34px Inter, Helvetica, Arial, sans-serif';
    if (x.letterSpacing !== undefined) x.letterSpacing = '12px';
    x.fillText(LANG === 'es' ? '¡YA ES NUESTRA!' : 'WE CLOSED!', W / 2, 520);
    if (x.letterSpacing !== undefined) x.letterSpacing = '0px';
    var grd = x.createLinearGradient(0, 560, W, 700); grd.addColorStop(0, '#F0DEB4'); grd.addColorStop(0.5, '#D6BD86'); grd.addColorStop(1, '#B8964F');
    x.fillStyle = grd; x.font = 'italic 104px "Instrument Serif", Georgia, serif';
    x.fillText(LANG === 'es' ? 'Bienvenidos' : 'Welcome home', W / 2, 660);
    x.fillStyle = '#ffffff'; x.font = '700 64px Inter, Helvetica, Arial, sans-serif';
    var st = String(d.street || ''); while (x.measureText(st).width > W - 200 && st.length > 4) st = st.slice(0, -2);
    x.fillText(st, W / 2, 780);
    x.fillStyle = 'rgba(255,255,255,.7)'; x.font = '400 34px Inter, Helvetica, Arial, sans-serif';
    var dt = d.closing ? parseDay(d.closing).toLocaleDateString(LOC, { month: 'long', day: 'numeric', year: 'numeric' }) : '';
    if (dt) x.fillText(dt, W / 2, 846);
    if (agentName) { x.fillStyle = '#D6BD86'; x.font = '500 34px Inter, Helvetica, Arial, sans-serif'; x.fillText((LANG === 'es' ? 'Gracias, ' : 'Thank you, ') + agentName, W / 2, 1150); }
    x.fillStyle = 'rgba(255,255,255,.45)'; x.font = '600 24px Inter, Helvetica, Arial, sans-serif';
    if (x.letterSpacing !== undefined) x.letterSpacing = '8px';
    x.fillText('VINTO', W / 2, 1240);
  }

  function wireCard(d) {
    var c = document.getElementById('closedCard'); if (!c) return;
    var draw = function (name) { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { drawCard(d, name); }); };
    draw('');
    rpc('client_team', { t: token }).then(function (t) { if (t && t.agent && t.agent.name && t.agent.name !== 'Your agent') draw(t.agent.name); }).catch(function () {});
    document.getElementById('shareCard').addEventListener('click', function () {
      c.toBlob(function (blob) {
        var file = new File([blob], 'we-closed.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: 'We closed!' }).catch(function () {});
        else { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'we-closed.png'; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500); }
      }, 'image/png');
    });
  }

  function wire(d) {
    wireCard(d);
    var cal = document.getElementById('addCal');
    if (cal) cal.addEventListener('click', function () {
      var blob = new Blob([calendarFile(d)], { type: 'text/calendar;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'closing-dates.ics';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
    var share = document.getElementById('shareLink');
    if (share) share.addEventListener('click', function () {
      var note = 'Anyone with this link can see this page. Only share it with people helping with your move.';
      if (navigator.share) navigator.share({ title: 'Our home timeline', text: 'Here’s where things stand with ' + (d.street || 'our home') + '.', url: location.href }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { alert('Link copied. ' + note); });
      else prompt(note, location.href);
    });
    wireMessages();
    wireTeam();
    wirePublic();
    var lb = document.getElementById('langBtn');
    if (lb) lb.addEventListener('click', function () { try { localStorage.setItem('vinto-lang', LANG === 'es' ? 'en' : 'es'); } catch (e) {} location.reload(); });
    Array.prototype.forEach.call(document.querySelectorAll('.check'), function (el) {
      function toggle() {
        var on = !el.classList.contains('on');
        el.classList.toggle('on', on); el.setAttribute('aria-checked', on ? 'true' : 'false');
        rpc('client_check', { t: token, item: el.getAttribute('data-item'), is_done: on }).catch(function () { el.classList.toggle('on', !on); alert('That didn’t save. Please try again.'); });
      }
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.home'), function (el) {
      var home = d.tour.homes[+el.getAttribute('data-home')];
      var note = el.querySelector('.note'), current = 0;
      var on = el.querySelector('.rate .on'); if (on) current = +on.getAttribute('data-r');
      function save() {
        return rpc('client_rate', { t: token, home: home.address, rating: current, note: note.value }).catch(function () { alert('That didn’t save. Please try again.'); });
      }
      Array.prototype.forEach.call(el.querySelectorAll('.rate button'), function (b) {
        b.addEventListener('click', function () {
          var r = +b.getAttribute('data-r');
          current = current === r ? 0 : r;
          Array.prototype.forEach.call(el.querySelectorAll('.rate button'), function (x) { x.classList.toggle('on', +x.getAttribute('data-r') === current); });
          save();
        });
      });
      note.addEventListener('change', function () { if (current) save(); });
    });
    var form = document.getElementById('guide');
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var answers = {};
      GUIDE.forEach(function (q) { var v = form.elements[q[0]].value.trim(); if (v) answers[q[0]] = v; });
      var s = document.getElementById('guideSaved'); s.textContent = 'Saving…';
      rpc('client_save_guide', { t: token, answers: answers }).then(function (ok) { s.textContent = ok ? 'Saved. Thank you!' : 'Couldn’t save. Try again.'; })
        .catch(function () { s.textContent = 'Couldn’t save. Try again.'; });
    });
  }


  // A live sample with made-up data (linked from vintorealty.com). Nothing is saved.

    function key(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    rpc = function (name) {
      if (name === 'client_team') return Promise.resolve({ agent: { role: 'Your agent', name: 'Taylor Brooks', phone: '(404) 555-0123', email: 'taylor@example.com', company: 'Sample Realty' },
        team: kind === 'seller' ? [{ role: 'Closing attorney', name: 'Morgan Ellis', company: 'Ellis Law Group', phone: '(404) 555-0188', email: 'closings@example.com' }]
          : [{ role: 'Lender', name: 'Sam Ortiz', company: 'Peach State Mortgage', phone: '(404) 555-0144', email: 'sam@example.com' }, { role: 'Closing attorney', name: 'Morgan Ellis', company: 'Ellis Law Group', phone: '(404) 555-0188', email: 'closings@example.com' }, { role: 'Home inspector', name: 'Chris Nguyen', company: 'Southern Home Inspections', phone: '(678) 555-0102', email: '' }] });
      if (name === 'client_messages_for') return Promise.resolve([
        { body: kind === 'seller' ? 'Should we leave the lights on for showings this weekend?' : 'Can we schedule a second look at the house before the inspection?', fromClient: true, at: new Date(Date.now() - 7200000).toISOString() },
        { body: kind === 'seller' ? 'Yes, please! Lights on and blinds open. I’ll handle the rest.' : 'Absolutely. I asked the listing agent for Thursday at 5. I’ll confirm here.', fromClient: false, at: new Date(Date.now() - 5400000).toISOString() }]);

      first: seller ? 'Jordan' : 'Maya', role: seller ? 'Seller' : 'Buyer', brokerage: 'Sample Realty', closing: seller ? null : key(25),
      dates: seller ? [{ label: 'Listing photos', date: key(-6), done: true }, { label: 'Listing goes live', date: key(-2), done: true }, { label: 'Open house', date: key(4), done: false }]

        : [{ id: 'a', label: 'Send your mortgage pre-approval letter', done: true }, { id: 'b', label: 'Schedule the home inspection', done: true }, { id: 'c', label: 'Pick a homeowners insurance company and send it to your lender', done: false, due: key(10) }],

      ratings: seller ? [] : [{ address: '412 Oak Hollow Ln, Alpharetta, GA', rating: 1, note: 'Loved the backyard and the kitchen island' }],
      commute: seller ? null : 'Ponce City Market, Atlanta, GA',
      buyerFeedback: seller ? ['Loved the kitchen and the natural light.', 'Great school district. Backyard is a little small for them.', 'Clean and move-in ready. Comparing with one other home.'] : [],
      showingsThisWeek: seller ? 6 : null,

      facts: seller ? [{ label: 'Bedrooms and baths', value: '5 bedrooms, 4 baths' }, { label: 'Year built', value: '2008' }] : [{ label: 'Bedrooms and baths', value: '4 bedrooms, 3 baths' }, { label: 'Schools', value: 'Milton High School' }, { label: 'HOA', value: 'Swim and tennis community' }],

    };
    if (kind === 'closed') { d.stage = 'Closed'; d.closing = key(-30); d.dates.forEach(function (x) { x.done = true; }); d.items.forEach(function (x) { x.done = true; }); d.tour = null; }
    render(d);
    var b = document.createElement('div');
    b.className = 'demo-bar';
    b.innerHTML = 'Sample portal with made-up data. <a href="#demo=' + (seller ? 'buyer' : 'seller') + '" onclick="setTimeout(function(){location.reload()},0)">See the ' + (seller ? 'buyer' : 'seller') + ' view</a> · <a href="https://vintorealty.com/#pricing">Get Vinto</a>';
    document.body.insertBefore(b, document.body.firstChild);
  }

  function showGuide() {
    rpc('home_guide', { g: guideToken }).then(function (d) {
      if (!d) { app.innerHTML = '<div class="center">This guide isn’t available. Ask your agent for a new link.</div>'; return; }
      var a = d.answers || {};
      var html = '<header class="hero"><div class="wrap"><div class="brand"><span><img src="img/mark.png" alt="">VINTO</span><small>' + esc(d.brokerage || '') + '</small></div>' +
        '<h1>Welcome home to<br><em>' + esc(d.street) + '</em></h1><div class="street">Everything the previous owners wanted you to know.</div></div></header><main><div class="wrap"><section class="card">';
      var any = false;
      GUIDE.forEach(function (q) { if (a[q[0]]) { any = true; html += '<div class="gsec"><h3>' + esc(q[1]) + '</h3><p>' + esc(a[q[0]]) + '</p></div>'; } });
      if (!any) html += '<p class="empty">The guide is still being filled in.</p>';
      html += '</section><p class="empty" style="text-align:center;margin-top:22px">Congratulations on your new home!</p></div></main>';
      app.innerHTML = html;
    }).catch(function () { app.innerHTML = '<div class="center">We couldn’t load this guide right now. Please try again in a minute.</div>'; });
  }
})();
