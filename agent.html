<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real estate · Vinto</title>
<meta name="theme-color" content="#070B0A">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root { --obsidian:#070B0A; --ink:#0E1513; --ivory:#F4F3EF; --line:#E6E3DA; --line2:#EEEBE4; --muted:#55595A; --faint:#7B7F80; --gold:#9C7B3C; --champagne:#D6BD86; --champagne-2:#F0DEB4; --cream:#F8F3E7; --red:#B42318; --green:#2F8F6B;
  --sans:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif; --serif:"Instrument Serif",Georgia,serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ivory); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }
header { background: radial-gradient(ellipse 90% 70% at 80% 0%, rgba(214,189,134,.2), transparent 60%), var(--obsidian); color: #fff; padding: 40px 0 70px; text-align: center; }
.avatar { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(214,189,134,.6); background: #1a1f1d; display: block; margin: 0 auto; }
.initials { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font: 400 46px var(--serif); font-style: italic; color: var(--champagne-2); border: 2px solid rgba(214,189,134,.5); background: #141917; }
h1 { font-size: 32px; letter-spacing: -.03em; margin: 18px 0 2px; }
.title { color: var(--champagne); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.bio { color: rgba(255,255,255,.75); font-size: 15.5px; line-height: 1.55; margin: 14px auto 0; max-width: 440px; }
.actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.actions a { font: 600 14.5px var(--sans); text-decoration: none; padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(214,189,134,.4); color: var(--champagne-2); }
.actions a.primary { background: var(--champagne); color: var(--obsidian); border-color: var(--champagne); }
main { margin-top: -40px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 14px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
h2 { font-size: 21px; letter-spacing: -.02em; margin: 6px 0 12px; }
.home { border-top: 1px solid var(--line2); padding-top: 14px; margin-top: 14px; }
.home:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.home img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; display: block; background: var(--cream); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--obsidian); color: var(--champagne); margin-top: 12px; }
.tag.sold { background: var(--cream); color: var(--gold); }
.home b { display: block; font-size: 18px; margin-top: 8px; }
.home .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.home .price { font-weight: 700; color: var(--gold); font-size: 18px; margin-top: 6px; }
.home button { margin-top: 10px; font: 600 14px var(--sans); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--ivory); color: var(--ink); cursor: pointer; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
input, textarea { width: 100%; font: 16px var(--sans); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
textarea { min-height: 90px; resize: vertical; }
.btn { width: 100%; margin-top: 16px; font: 600 16px var(--sans); padding: 15px; border-radius: 999px; border: 0; background: var(--obsidian); color: var(--champagne-2); cursor: pointer; }
.btn:disabled { opacity: .6; }
.err { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 1em; }
.ok { text-align: center; padding: 20px 0; }
.ok h3 { font-size: 22px; margin: 0 0 6px; }
.tq { margin: 12px 0 0; padding: 0 0 12px; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5; font-style: italic; } .tq cite { display: block; font-style: normal; font-size: 13px; color: var(--faint); margin-top: 4px; }
.calcout { margin: 14px 0 6px; } .calcout b { display: block; font-size: 26px; } .calcout span { display: block; color: var(--faint); font-size: 14px; margin-top: 2px; }
.fine { text-align: center; font-size: 12.5px; color: var(--faint); margin: 18px 0 36px; }
.fine a { color: var(--gold); text-decoration: none; }
.center { text-align: center; padding: 90px 20px; color: var(--muted); }
.demo { background: var(--champagne); color: var(--obsidian); text-align: center; font-size: 13.5px; padding: 8px; }
</style>
</head>
<body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function () {
  var SB = 'https://ovwsmktnufozcyaqaqfz.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_IvKFJC5hSi_ydgtLY5wk-A_FeJHikgb';
  var hash = new URLSearchParams(location.hash.slice(1));
  var slug = (hash.get('u') || '').toLowerCase(), demo = hash.has('demo');
  var app = document.getElementById('app');
  var rpc = function (name, body) {
    return fetch(SB + name, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.message) || 'HTTP ' + r.status); return j; }); });
  };
  if (demo) {
    slug = 'demo';
    rpc = function (name) {
      return Promise.resolve(name === 'agent_page' ? {
        name: 'Taylor Brooks', title: 'REALTOR®', phone: '(404) 555-0123', email: 'taylor@example.com', brokerage: 'Sample Realty',
        bio: 'Helping families buy and sell across north Atlanta for 9 years. Straight answers, a calm process and a plan for every step.', photo: '',
        listings: [
          { street: '123 Sample Lane', city: 'Alpharetta, GA', kind: 'Just Listed', price: '$612,000', beds: '4', baths: '3.5', sqft: '3,120', photo: '', open: '' },
          { street: '48 Magnolia Ct', city: 'Roswell, GA', kind: 'Open House', price: '$489,900', beds: '3', baths: '2.5', sqft: '2,240', photo: '', open: 'Sat, Dec 6 · 1–3 PM' },
          { street: '9 Birch Hollow', city: 'Milton, GA', kind: 'Just Sold', price: '$745,000', beds: '5', baths: '4', sqft: '3,900', photo: '', open: '' }
        ] } : true);
    };
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  if (!slug) { app.innerHTML = '<div class="center">This page link is missing part of its address.</div>'; return; }

  rpc('agent_page', { u: slug }).then(function (p) {
    if (!p) { app.innerHTML = '<div class="center">This page isn’t available.</div>'; return; }
    document.title = (p.name || 'Real estate') + (p.brokerage ? ' · ' + p.brokerage : '');
    var tel = String(p.phone || '').replace(/[^\d+]/g, '');
    var initials = String(p.name || '?').split(/\s+/).map(function (w) { return w[0] || ''; }).join('').slice(0, 2);
    var listings = p.listings || [];
    var active = listings.filter(function (l) { return !/sold|contract/i.test(l.kind); }), done = listings.filter(function (l) { return /sold|contract/i.test(l.kind); });
    function homes(list) {
      return list.map(function (l, i) {
        var specs = [l.beds && l.beds + ' bd', l.baths && l.baths + ' ba', l.sqft && l.sqft + ' sq ft'].filter(Boolean).join(' · ');
        return '<div class="home">' + (l.photo ? '<img src="' + esc(l.photo) + '" alt="' + esc(l.street) + '" loading="lazy">' : '') +
          '<span class="tag' + (/sold|contract/i.test(l.kind) ? ' sold' : '') + '">' + esc(l.kind || 'Listing') + '</span>' +
          '<b>' + esc(l.street) + '</b><div class="meta">' + esc([l.city, specs].filter(Boolean).join(' · ')) + '</div>' +
          (l.price ? '<div class="price">' + esc(l.price) + '</div>' : '') + (l.open ? '<div class="meta">' + esc(l.open) + '</div>' : '') +
          (/sold|contract/i.test(l.kind) ? '' : '<button type="button" data-about="' + esc(l.street) + '">I’m interested</button>') + '</div>';
      }).join('');
    }
    app.innerHTML = (demo ? '<div class="demo">Sample page with made-up data · <a href="https://vintorealty.com/" style="color:inherit">Get Vinto</a></div>' : '') +
      '<header><div class="wrap">' + (p.photo ? '<img class="avatar" src="' + esc(p.photo) + '" alt="">' : '<div class="initials">' + esc(initials) + '</div>') +
      '<h1>' + esc(p.name) + '</h1><div class="title">' + esc([p.title, p.brokerage].filter(Boolean).join(' · ')) + '</div>' +
      (p.bio ? '<p class="bio">' + esc(p.bio) + '</p>' : '') +
      '<div class="actions">' + (tel ? '<a class="primary" href="tel:' + esc(tel) + '">Call</a><a href="sms:' + esc(tel) + '">Text</a>' : '') + (p.email ? '<a href="mailto:' + esc(p.email) + '">Email</a>' : '') + '<a href="#contact" id="toForm">Get in touch</a></div></div></header>' +
      '<main class="wrap">' +
      (active.length ? '<section class="card"><div class="eyebrow">For sale</div><h2>Current listings</h2>' + homes(active) + '</section>' : '') +
      (done.length ? '<section class="card"><div class="eyebrow">Recent</div><h2>Just sold</h2>' + homes(done) + '</section>' : '') +
      ((p.testimonials || []).length ? '<section class="card"><div class="eyebrow">Kind words</div><h2>What clients say</h2>' + p.testimonials.map(function (t) { return '<blockquote class="tq">“' + esc(t.quote) + '”' + (t.byline ? '<cite>' + esc(t.byline) + '</cite>' : '') + '</blockquote>'; }).join('') + '</section>' : '') +
      '<section class="card" id="calc"><div class="eyebrow">Plan ahead</div><h2>What could you afford?</h2>' +
      '<div class="calc"><label for="ci">Household income per year</label><input id="ci" inputmode="decimal" value="100000">' +
      '<label for="cd">Monthly debts (car, cards, loans)</label><input id="cd" inputmode="decimal" value="500">' +
      '<label for="cr">Interest rate (%)</label><input id="cr" inputmode="decimal" value="6.5">' +
      '<label for="cp">Down payment (%)</label><input id="cp" inputmode="decimal" value="10"></div>' +
      '<div class="calcout" id="co"></div><p class="meta">An estimate only, not a loan offer: 28% of income for housing, 36% for all debts, 30 years, about 1.6% a year for taxes and insurance. A lender gives the real numbers. Nothing you type here is saved or sent.</p></section>' +
      '<section class="card" id="contact"><div class="eyebrow">Let’s talk</div><h2>Buying, selling or just curious?</h2><form id="f" novalidate>' +
      '<label for="about">About</label><input id="about" maxlength="120" placeholder="A home, or anything at all">' +
      '<label for="n">Your name</label><input id="n" autocomplete="name" maxlength="120">' +
      '<label for="e">Email</label><input id="e" type="email" autocomplete="email" maxlength="254">' +
      '<label for="ph">Phone</label><input id="ph" type="tel" autocomplete="tel" maxlength="40">' +
      '<label for="m">Message (optional)</label><textarea id="m" maxlength="1000"></textarea>' +
      '<button class="btn" type="submit">Send</button><div class="err" id="err"></div></form></section>' +
      '<p class="fine">Your info goes only to ' + esc(p.name || 'this agent') + '. It’s never sold or shared. · Powered by <a href="https://vintorealty.com/">Vinto</a></p></main>';

    // Affordability calculator (idea 25): same formulas as the app's src/calc.ts. Runs in the browser only.
    var calc = function () {
      var v = function (id) { return Number(String(document.getElementById(id).value).replace(/[^0-9.]/g, '')) || 0; };
      var inc = v('ci') / 12, debts = v('cd'), r = v('cr') / 100 / 12, d = Math.min(0.99, v('cp') / 100), n = 360;
      var maxH = Math.max(0, Math.min(inc * 0.28, inc * 0.36 - debts));
      var f = r ? r / (1 - Math.pow(1 + r, -n)) : 1 / n;
      var price = maxH / ((1 - d) * f + 0.016 / 12);
      price = Math.max(0, Math.floor(price / 1000) * 1000);
      var fmt = function (x) { return '$' + Math.round(x).toLocaleString('en-US'); };
      document.getElementById('co').innerHTML = '<b>Up to about ' + fmt(price) + '</b><span>About ' + fmt(maxH) + ' a month for housing · ' + fmt(price * d) + ' down</span>';
    };
    ['ci', 'cd', 'cr', 'cp'].forEach(function (id) { document.getElementById(id).addEventListener('input', calc); });
    calc();

    Array.prototype.forEach.call(document.querySelectorAll('[data-about]'), function (b) {
      b.addEventListener('click', function () { document.getElementById('about').value = b.getAttribute('data-about'); document.getElementById('contact').scrollIntoView({ behavior: 'smooth' }); setTimeout(function () { document.getElementById('n').focus(); }, 400); });
    });
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var n = document.getElementById('n').value.trim(), em = document.getElementById('e').value.trim(), ph = document.getElementById('ph').value.trim();
      var err = document.getElementById('err');
      if (!n) { err.textContent = 'Please add your name.'; return; }
      if (!em && !ph) { err.textContent = 'Please add an email or phone number.'; return; }
      var btn = this.querySelector('.btn'); btn.disabled = true; err.textContent = '';
      rpc('agent_page_lead', { u: slug, p_name: n, p_email: em, p_phone: ph, p_message: document.getElementById('m').value.trim(), p_about: document.getElementById('about').value.trim() })
        .then(function (ok) {
          if (!ok) throw new Error('This page isn’t taking messages right now.');
          document.getElementById('contact').innerHTML = '<div class="ok"><h3>Thanks, ' + esc(n.split(' ')[0]) + '!</h3><p class="meta">' + esc((p.name || 'The agent').split(' ')[0]) + ' will be in touch soon.</p></div>';
        })
        .catch(function (x) { btn.disabled = false; err.textContent = x.message && x.message.length < 120 ? x.message : 'That didn’t send. Please try again.'; });
    });
  }).catch(function () { app.innerHTML = '<div class="center">We couldn’t load this page right now. Please try again in a minute.</div>'; });
})();
</script>
</body>
</html>
